name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule une exécution en cours si un nouveau commit arrive sur la même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Le test d'intégration RLS (RLS_TEST=1) exige un Supabase local : il se skippe
      # ici automatiquement (describe.skipIf), les tests unitaires suffisent en CI.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

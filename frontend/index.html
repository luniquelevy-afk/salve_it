<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Salve Italia — accompagnement des étudiants congolais vers les études en Italie." />
    <meta name="theme-color" content="#0f2038" />
    <title>Salve Italia</title>
    <!-- « Warm Institutional Modernism » : titres éditoriaux en Newsreader (serif),
         interface en Plus Jakarta Sans. display=swap ne bloque jamais le texte —
         un fallback système reste appliqué le temps du chargement (ENF-03, connexions lentes). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <!-- Polices spécifiques à la landing page (« cockpit » sombre) : Inter, Playfair Display, JetBrains Mono. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
